name: PuyaKhan Android checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Run parser unit tests
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Build unsigned release-independent debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Save debug APK
        uses: actions/upload-artifact@v4
        with:
          name: puyakhan-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
